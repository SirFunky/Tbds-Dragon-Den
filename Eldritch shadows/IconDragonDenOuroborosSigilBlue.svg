<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Dragon Den ouroboros sigil</title>
  <desc id="desc">A traditional tattoo-inspired eastern dragon curled into an ouroboros, rendered as a dark blue sigil.</desc>

  <defs>
    <linearGradient id="ink" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="15%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="inkDark" x1="30" y1="20" x2="100" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- faint halo -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#60a5fa" stroke-opacity="0.14" stroke-width="2"/>

  <!-- outer body: bold calligraphic ring -->
  <path d="
    M97 39
    C104 47,108 57,107 68
    C105 86,93 101,76 108
    C59 114,39 110,27 97
    C15 84,11 66,16 49
    C21 33,33 20,49 15
    C63 11,78 13,89 21
    C99 28,104 37,105 46
    C106 56,102 64,95 70
    C88 76,79 80,69 80
    C58 80,49 76,43 69
    C37 61,36 52,40 44
    C44 36,52 30,62 28
    C72 26,82 28,89 32
    C93 35,95 37,97 39
    L90 44
    C86 41,80 39,73 39
    C63 39,55 42,50 48
    C46 53,46 59,50 64
    C55 70,64 73,74 72
    C82 71,89 68,95 63
    C98 60,100 56,99 51
    C98 44,95 38,88 32
    C79 25,67 22,56 24
    C42 26,31 35,26 48
    C21 61,24 76,33 87
    C42 98,57 103,71 100
    C85 97,95 86,97 73
    C99 61,96 48,89 39
    Z"
    fill="url(#inkDark)"
    filter="url(#glow)"/>

  <!-- inner highlight line -->
  <path d="
    M88 37
    C95 44,98 53,97 63
    C95 78,86 91,73 96
    C59 101,44 98,34 88
    C25 78,22 64,26 51
    C29 39,39 30,50 27
    C61 24,73 26,82 32"
    fill="none"
    stroke="url(#ink)"
    stroke-width="4.3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"/>

  <!-- tail entering mouth -->
  <path d="
    M88 56
    C83 60,78 63,71 66
    C65 69,60 72,56 77"
    fill="none"
    stroke="url(#ink)"
    stroke-width="6.4"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- tail tip flourish -->
  <path d="
    M54 79
    C49 85,49 92,54 97
    C60 94,63 89,62 83"
    fill="none"
    stroke="url(#ink)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- head, more tattoo-like -->
  <path d="
    M86 24
    C93 20,102 20,109 24
    C116 29,118 38,113 45
    C108 52,98 56,88 55
    C82 54,77 51,74 46
    C71 41,72 34,76 29
    C79 26,82 25,86 24
    Z"
    fill="url(#inkDark)"/>

  <!-- snout / mouth -->
  <path d="
    M107 31
    C113 33,116 37,115 41
    C114 45,110 48,103 49
    C99 49,94 48,90 46
    C94 43,97 40,99 36
    C101 33,104 31,107 31
    Z"
    fill="url(#inkDark)"/>

  <!-- jaw gripping tail -->
  <path d="
    M99 45
    C95 48,91 51,87 55
    C84 57,81 58,79 59"
    fill="none"
    stroke="#dbeafe"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- horn flourishes -->
  <path d="M85 25 C84 16,89 9,97 6" fill="none" stroke="url(#ink)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M91 24 C94 15,102 10,110 11" fill="none" stroke="url(#ink)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- whisker flourishes -->
  <path d="M108 35 C118 31,123 24,124 17" fill="none" stroke="url(#ink)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M106 41 C118 43,123 49,124 57" fill="none" stroke="url(#ink)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- mane / spine fins -->
  <path d="
    M79 27 L73 22
    M74 31 L67 28
    M71 37 L63 36
    M71 45 L63 47
    M73 53 L66 58
    M35 89 L30 95
    M42 95 L40 103
    M50 99 L51 108"
    fill="none"
    stroke="url(#ink)"
    stroke-width="2.4"
    stroke-linecap="round"/>

  <!-- eye -->
  <path d="M96 34 C98 32,101 32,103 34 C101 36,98 36,96 34 Z" fill="#dbeafe"/>
  <circle cx="100" cy="34" r="1.1" fill="#172554"/>

  <!-- fang -->
  <path d="M97 43 L95 47" fill="none" stroke="#eff6ff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- central sigil spark -->
  <path d="M64 50 L67 58 L75 61 L67 64 L64 72 L61 64 L53 61 L61 58 Z"
        fill="#60a5fa" fill-opacity="0.92" stroke="#dbeafe" stroke-width="1.2" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
